apiVersion: v1
kind: ConfigMap
metadata:
  name: cce-addon-desired-versions-{{ .Values.data.cluster_name | default "cluster" | lower | replace "_" "-" | replace "." "-" }}
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: cce-cluster-addons
    cce.io/cluster: {{ .Values.data.cluster_name | default "" | quote }}
    environment: {{ .Values.data.environment | default "" | quote }}
data:
  coredns: {{ .Values.data.coredns_version | default "" | quote }}
  kube-proxy: {{ .Values.data.kube_proxy_version | default "" | quote }}
  vpc-router: {{ .Values.data.vpc_router_version | default "" | quote }}
  everest: {{ .Values.data.everest_version | default "" | quote }}
  kubernetes-version: {{ .Values.data.kubernetes_version | default "" | quote }}
  environment: {{ .Values.data.environment | default "" | quote }}
